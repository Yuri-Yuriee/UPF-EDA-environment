# Prefer an explicit output override. Otherwise:
#   1) TECH_MV-local outputs, if a GDS is present.
#   2) project build_PR/outputs, which matches the normal TECH_MV runtime.
#   3) default to build_PR/outputs for the first run.
if (! $?VERIFY_OUTPUT_DIR) then
    if (-e "$TECH_MV_ROOT/outputs/${VERIFY_TOP}.gds") then
        setenv VERIFY_OUTPUT_DIR "$TECH_MV_ROOT/outputs"
    else if (-e "$PROJECT_ROOT/build_PR/outputs/${VERIFY_TOP}.gds") then
        setenv VERIFY_OUTPUT_DIR "$PROJECT_ROOT/build_PR/outputs"
    else
        setenv VERIFY_OUTPUT_DIR "$PROJECT_ROOT/build_PR/outputs"
    endif
endif

if (! $?VERIFY_GDS) then
    setenv VERIFY_GDS "$VERIFY_OUTPUT_DIR/${VERIFY_TOP}.gds"
endif

if (! $?VERIFY_PG_NETLIST) then
    setenv VERIFY_PG_NETLIST "$VERIFY_OUTPUT_DIR/${VERIFY_TOP}_pg.v"
endif

